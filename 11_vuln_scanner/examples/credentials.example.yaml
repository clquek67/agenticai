# Copy to credentials.yaml (git-ignored) and set the environment variables.
# Use read-only accounts. Passwords are read from environment variables so
# they are never stored in this file.
profiles:
  cisco_ro:
    username: svc-vulnscan
    password_env: VULNSCAN_CISCO_PASSWORD
    secret_env: VULNSCAN_CISCO_ENABLE      # optional: enable secret, needed for 'show running-config'
  asa_ro:
    username: svc-vulnscan
    password_env: VULNSCAN_ASA_PASSWORD
    secret_env: VULNSCAN_ASA_ENABLE
  comware_ro:
    username: svc-vulnscan
    password_env: VULNSCAN_COMWARE_PASSWORD
