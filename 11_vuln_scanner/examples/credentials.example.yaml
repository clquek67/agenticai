# Copy to credentials.yaml (git-ignored) and set the environment variables.
# Use read-only accounts. Passwords are read from environment variables so
# they are never stored in this file.
profiles:
  cisco_ro:
    username: svc-vulnscan
    password_env: VULNSCAN_CISCO_PASSWORD
    secret_env: VULNSCAN_CISCO_ENABLE      # optional: enable secret, needed for 'show running-config'
  asa_ro:
    username: svc-vulnscan
    password_env: VULNSCAN_ASA_PASSWORD
    secret_env: VULNSCAN_ASA_ENABLE
  comware_ro:
    username: svc-vulnscan
    password_env: VULNSCAN_COMWARE_PASSWORD
  linux_ro:
    username: vulnscan            # ordinary user; no sudo needed
    password_env: VULNSCAN_LINUX_PASSWORD
  windows_ro:
    username: 'CORP\svc-vulnscan' # member of 'Remote Management Users' (WinRM)
    password_env: VULNSCAN_WINDOWS_PASSWORD
    winrm_port: 5986              # HTTPS listener
    winrm_transport: ntlm         # or kerberos
    verify_tls: true              # set false only for self-signed lab certificates
  aruba_ro:                       # ArubaOS controllers, ArubaOS-Switch and AOS-CX (read-only/operator role)
    username: svc-vulnscan
    password_env: VULNSCAN_ARUBA_PASSWORD
  clearpass_ro:                   # ClearPass CLI account (appadmin)
    username: appadmin
    password_env: VULNSCAN_CLEARPASS_PASSWORD
